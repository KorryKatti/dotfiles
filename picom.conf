# Use lightweight backend
backend = "xrender";
vsync = true;

# Minimal shadows
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.25;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Disable shadows for some things
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'i3-frame'",
  "class_g = 'Dunst'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# Light fade animations
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# No blur (saves battery)
blur-background = false;

# Optional mild transparency for inactive windows
inactive-opacity = 1.0;
active-opacity = 1.0;

opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'kitty'",
  "90:class_g = 'URxvt'",
  "90:class_g = 'XTerm'",
];


# Fix tearing on Intel/AMD/Nvidia
unredir-if-possible = true;

# Don't mess with fullscreen apps
detect-client-opacity = true;
