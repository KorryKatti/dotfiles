# --- Previous Visual & Logic Settings ---
no-border
autofit=70%
title="${filename}"

# --- Advanced Built-in UI Tweaks ---

script-opts-add=osc-scalewindowed=1.2
script-opts-add=osc-scalefullscreen=1.2

# Shows title of the video and the current time on the bar
script-opts-add=osc-title=${filename}
script-opts-add=osc-timetotal=yes

# Shows a small thumbnail-like time tooltip when hovering over the seekbar
script-opts-add=osc-seekbarhandlesize=0.8
script-opts-add=osc-tooltip=yes

# Makes the UI appear instantly when you move the mouse
script-opts-add=osc-minmousemove=0
script-opts-add=osc-fadeduration=200

# --- User-Friendly Subtitles ---
sub-font='sans-serif'
sub-font-size=44
sub-bold=yes
sub-color='#FFFFFFFF'
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color='#44000000'
